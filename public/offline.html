<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a3aa8">
<title>Offline | JNV Teacher Routine Portal</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:linear-gradient(#132049,#1a3aa8)}
  .logo{width:96px;height:96px;border-radius:50%;background:#fff;padding:8px;box-sizing:border-box;box-shadow:0 0 0 3px #f9a03f}
  .logo img{width:100%;height:100%;object-fit:contain}
  h1{margin:8px 0 0;font-size:1.3rem}
  p{margin:0;max-width:320px;color:#d9e6ff;line-height:1.5}
  button{margin-top:8px;border:0;border-radius:10px;background:#f28a1a;color:#fff;font-weight:700;font-size:1rem;padding:12px 28px}
  button:active{transform:scale(.96)}
</style>
</head>
<body>
  <div class="logo"><img src="/nvs-logo-sm.png" alt="Navodaya emblem"></div>
  <h1>You are offline</h1>
  <p>The portal needs an internet connection to show the latest routine, MOD duty and notices. Please reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
